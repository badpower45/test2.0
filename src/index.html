    <!-- Early buffering stub: intercept customElements.define calls (accept bad calls), buffer them
         and replay valid definitions to native registry after DOMContentLoaded. This prevents
         native TypeErrors like "2 arguments required" and avoids crashes from duplicate defines. -->
    <script>
      (function(){
        try{
          if(typeof window === 'undefined') return;
          var native = window.customElements;
          if(!native) return;

          // Don't wrap twice
          if(native.__bufferingWrapped) return;

          var buffer = [];

          // Create a proxy object that safely accepts define/get
          var safe = {
            get: function(name){
              try{ return native.get(name); }catch(e){ return undefined; }
            },
            define: function(name, constructor /*, options */){
              // Buffer everything; only replay valid defines later
              try{
                buffer.push([name, constructor, arguments[2]]);
              }catch(e){ }
            }
          };

          // Mark wrapper on safe
          safe.__isSafeStub = true;

          // Replace window.customElements with stub (most scripts will call define on it)
          try{
            window.customElements = safe;
          }catch(e){
            // If not writable, attempt to wrap prototype define instead (best-effort)
            try{
              if(typeof CustomElementRegistry !== 'undefined' && CustomElementRegistry.prototype && !CustomElementRegistry.prototype.__bufferingWrapped){
                var protoOrig = CustomElementRegistry.prototype.define;
                CustomElementRegistry.prototype.define = function(name, constructor){
                  try{ buffer.push([name, constructor, arguments[2]]); }catch(e){}
                };
                CustomElementRegistry.prototype.__bufferingWrapped = true;
              }
            }catch(e){}
          }

          // After DOMContentLoaded, restore native registry and replay buffered defines safely
          window.addEventListener('DOMContentLoaded', function(){
            try{
              if(native && !native.__replayed){
                // restore native reference if we replaced it
                try{ window.customElements = native; }catch(e){}
                // replay buffered defines: only apply those with a constructor and not duplicate
                for(var i=0;i<buffer.length;i++){
                  var rec = buffer[i];
                  var n = rec[0];
                  var c = rec[1];
                  var o = rec[2];
                  try{
                    if(!c) continue;
                    if(native.get && native.get(n)) continue;
                    native.define(n,c,o);
                  }catch(e){ /* ignore individual failures */ }
                }
                native.__replayed = true;
              }
            }catch(e){}
          }, { once: true });

          // mark original native so we don't rewrap
          try{ native.__bufferingWrapped = true; }catch(e){}
        }catch(e){ /* swallow */ }
      })();
    </script>
    <!-- Diagnostic logger: logs dynamic script insertions and customElements.define calls with stack traces -->
    <script>
      (function(){
        try{
          function logStack(prefix){
            try{
              var e = new Error();
              console.log(prefix, e.stack.split('\n').slice(2,7).join('\n'));
            }catch(e){}
          }

          var origAppend = Element.prototype.appendChild;
          Element.prototype.appendChild = function(node){
            try{
              if(node && node.tagName === 'SCRIPT'){
                var src = node.getAttribute && node.getAttribute('src') || node.src || '(inline)';
                console.info('[diag] appendChild script:', src);
                logStack('[diag] append stack:');
              }
            }catch(e){}
            return origAppend.call(this,node);
          };

          var origInsert = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, refNode){
            try{
              if(newNode && newNode.tagName === 'SCRIPT'){
                var src = newNode.getAttribute && newNode.getAttribute('src') || newNode.src || '(inline)';
                console.info('[diag] insertBefore script:', src);
                logStack('[diag] insert stack:');
              }
            }catch(e){}
            return origInsert.call(this,newNode, refNode);
          };

          // wrap define to log calls
          if(typeof CustomElementRegistry !== 'undefined' && CustomElementRegistry.prototype && CustomElementRegistry.prototype.define){
            var origDefine = CustomElementRegistry.prototype.define;
            CustomElementRegistry.prototype.define = function(name, constructor){
              try{
                console.info('[diag] define called for', name);
                logStack('[diag] define stack:');
              }catch(e){}
              return origDefine.apply(this, arguments);
            };
          }
        }catch(e){}
      })();
    </script>
