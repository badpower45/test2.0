    <!-- Early guard: wrap CustomElementRegistry.define to prevent bad/duplicate defines from third-party bundles -->
    <script>
      (function(){
        try{
          if(typeof window === 'undefined') return;
          var proto = (typeof CustomElementRegistry !== 'undefined' && CustomElementRegistry.prototype) ? CustomElementRegistry.prototype : null;
          if(proto && !proto.__safeDefineWrapped){
            var orig = proto.define;
            proto.define = function(name, constructor /*, options */){
              try{
                if(!constructor){
                  console.warn('[guard] skip define without constructor for', name);
                  return;
                }
                if(this.get && this.get(name)){
                  console.warn('[guard] skip duplicate define for', name);
                  return;
                }
                return orig.apply(this, arguments);
              }catch(e){
                console.warn('[guard] define wrapper caught', e);
                return;
              }
            };
            proto.__safeDefineWrapped = true;
          }

          if(window.customElements && typeof window.customElements.define === 'function' && !window.customElements.__safeWrapped){
            var orig2 = window.customElements.define.bind(window.customElements);
            window.customElements.define = function(name, constructor /*, options */){
              try{
                if(!constructor){
                  console.warn('[guard] skip window.define without constructor for', name);
                  return;
                }
                if(window.customElements.get && window.customElements.get(name)){
                  console.warn('[guard] skip window.define duplicate for', name);
                  return;
                }
                return orig2.apply(window.customElements, arguments);
              }catch(e){
                console.warn('[guard] window define wrapper caught', e);
                return;
              }
            };
            window.customElements.__safeWrapped = true;
          }
        }catch(e){
          // swallow
        }
      })();
    </script>
