  <body>
    <div id="root"></div>
    <!-- Removed aggressive script-blocker (was preventing app scripts/CSS from loading). -->
    <!-- Inline guard: prevent duplicate custom element definition errors (runs before modules) -->
    <script>
      (function(){
        try {
          if (typeof window !== 'undefined' && window.customElements) {
            var orig = window.customElements.define.bind(window.customElements);
            window.customElements.define = function(){
              try {
                var name = arguments[0];
                var constructor = arguments[1];
                if (!constructor) {
                  return;
                }
                if (window.customElements.get(name)) {
                  return;
                }
                return orig.apply(window.customElements, arguments);
              } catch (e) {
                return;
              }
            };
          }
        } catch (e) {
          // swallow any unexpected errors from the guard itself
        }
      })();
    </script>
